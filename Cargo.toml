[package]
name = "euthyna-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Holds Euthyna agent keys outside the AI's reach and signs only vault requests."
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = "0.4.3"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
